name: Verify live sandbox
on:
  push:
    branches: [main]
    paths: [scripts/check-live.mjs, scripts/live-acceptance.mjs, .github/workflows/live-sandbox.yml]
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployed sandbox without moving funds
        run: node scripts/check-live.mjs | tee live-report.json
      - name: Verify live virtual order lifecycle
        run: node scripts/live-acceptance.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-sandbox-report
          path: live-report.json
