services:
  - type: web
    name: qmoosa-exchange-backend
    env: node
    plan: free
    buildCommand: npm ci && npm run verify
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
